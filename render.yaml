services:
  - type: web
    name: atif-contact-relay
    runtime: python
    plan: free
    buildCommand: python --version
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGIN
        value: https://atifakhan.github.io
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: CONTACT_TO
        value: atifat45@gmail.com
