services:
  - type: web
    name: atif-contact-relay
    runtime: python
    plan: free
    buildCommand: python --version
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGIN
        value: https://atifakhan.github.io
      - key: RESEND_FROM
        value: Atif Profile <onboarding@resend.dev>
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_TO
        value: atifat45@gmail.com
